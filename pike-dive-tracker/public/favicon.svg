<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="108" fill="#0f172a"/>
  <!-- Pike diver silhouette -->
  <g fill="none" stroke="#f8fafc" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Legs: hip to toes (up-right) -->
    <line x1="266" y1="297" x2="310" y2="120"/>
    <!-- Pointed toes -->
    <line x1="310" y1="120" x2="316" y2="95"/>
    <!-- Torso: hip to shoulder (up-left) -->
    <line x1="266" y1="297" x2="195" y2="155"/>
    <!-- Arms: shoulder reaching to shins -->
    <line x1="210" y1="180" x2="290" y2="195"/>
  </g>
  <!-- Head -->
  <circle cx="185" cy="135" r="30" fill="#f8fafc"/>
  <!-- Water hint -->
  <rect x="0" y="430" width="512" height="82" rx="0" fill="#1e3a5f" opacity="0.3"/>
</svg>
